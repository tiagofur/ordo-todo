# =============================================================================
# Deploy Workflow - Ordo-Todo
# Builds and deploys the application to production VPS
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ordo-todo-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ordo-todo-web

jobs:
  # =============================================================================
  # Test & Lint (Skip if emergency deploy)
  # =============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordo_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: packages/db

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma || echo "No migrations to apply"
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordo_todo_test

      - name: Lint
        run: npm run lint --workspaces --if-present || true

      - name: Type check
        run: npm run check-types --workspaces --if-present || true

  # =============================================================================
  # Build Backend Docker Image
  # =============================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Build Web Docker Image
  # =============================================================================
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ordotodo.app/api/v1
            NEXTAUTH_URL=https://ordotodo.app
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy to Production — VPS con Plesk, COMPARTIDO con otros proyectos.
  #
  # El compose y los scripts viajan desde el repo en cada deploy (fuente de
  # verdad); en el VPS solo vive el .env. Aquí no se reinicia Docker, no se
  # tocan puertos ni contenedores ajenos y no se hace `compose down`: compose
  # recrea solo los servicios cuya imagen cambió.
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-web]
    if: always() && needs.build-backend.result == 'success' && needs.build-web.result == 'success'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v5
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: true

      - name: Copy compose and scripts to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "deploy/docker-compose.plesk.yml,deploy/scripts/health.sh,deploy/scripts/backup-db.sh,deploy/scripts/rollback.sh"
          target: /opt/ordo-todo/.incoming
          strip_components: 1
          rm: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_TAG,GITHUB_USER,GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /opt/ordo-todo
            test -f .env || { echo "::error::Falta /opt/ordo-todo/.env (plantilla: deploy/.env.plesk.example)"; exit 1; }

            echo "[$(date)] 📄 Instalando compose y scripts del repo..."
            install -m 0644 .incoming/docker-compose.plesk.yml docker-compose.yml
            mkdir -p scripts backups
            install -m 0755 .incoming/scripts/*.sh scripts/
            rm -rf .incoming
            docker compose config -q

            echo "[$(date)] 🔐 Login en GHCR..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

            PREV_TAG=$(grep -E '^IMAGE_TAG=' .env | tail -1 | cut -d= -f2- | sed 's/[[:space:]]*#.*//; s/"//g')
            export IMAGE_TAG
            echo "[$(date)] 📦 Descargando imágenes ${IMAGE_TAG} (desplegada ahora: ${PREV_TAG:-?})..."
            docker compose pull backend web

            echo "[$(date)] 🗄️ Base de datos y migraciones..."
            docker compose up -d postgres
            if ! docker compose run --rm migrations; then
              echo "::error::Las migraciones fallaron; no se arrancan las imágenes nuevas contra un schema viejo."
              exit 1
            fi

            echo "[$(date)] 🚀 Arrancando backend y web..."
            docker compose up -d backend web

            echo "[$(date)] ⏳ Esperando a que estén sanos..."
            if ! ./scripts/health.sh --wait backend web; then
              if [ -n "${PREV_TAG}" ] && [ "${PREV_TAG}" != latest ] && [ "${PREV_TAG}" != "${IMAGE_TAG}" ]; then
                echo "::warning::backend/web no están sanos con ${IMAGE_TAG}; rollback automático a ${PREV_TAG} (las migraciones NO se deshacen)."
                ./scripts/rollback.sh "${PREV_TAG}" || echo "::error::El rollback automático también falló; intervención manual (RUNBOOK §4)."
              fi
              exit 1
            fi

            # Deja en .env la versión desplegada: un `docker compose up -d` manual
            # no cambiará de imagen por accidente.
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

            echo "[$(date)] 🧹 Limpiando imágenes antiguas de Ordo (solo las nuestras, >7 días)..."
            docker image prune -af --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/tiagofur/ordo-todo" || true

            docker compose ps
            echo "[$(date)] ✅ Deploy completado: ${IMAGE_TAG}"

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Backend: https://api.ordotodo.app/api/v1/health"
          echo "Web: https://ordotodo.app"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          echo "Rollback: Actions → Deploy → Run workflow sobre el commit anterior, o ./scripts/rollback.sh <sha> en el VPS."
