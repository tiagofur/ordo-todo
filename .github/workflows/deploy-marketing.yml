# =============================================================================
# Deploy Marketing Website - Ordo-Todo
# Construye la landing (apps/webpage) y la despliega en el VPS como el servicio
# `webpage` del compose de Ordo (/opt/ordo-todo, puerto 127.0.0.1:3002 →
# ordotodo.com vía Plesk). Mismo compose que la app; solo se toca ese servicio.
# =============================================================================

name: Deploy Marketing

on:
  push:
    branches:
      - main
    paths:
      - 'apps/webpage/**'
      - 'apps/webpage/Dockerfile'
      - 'packages/ui/**'
      - 'packages/ui-shared/**'
      - 'packages/styles/**'
      - 'packages/core/**'
      - 'packages/config/**'
      - 'packages/api-client/**'
      - 'packages/hooks/**'
      - 'packages/i18n/**'
      - 'packages/stores/**'
      - 'deploy/docker-compose.plesk.yml'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MARKETING_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ordo-todo-marketing-web

jobs:
  # =============================================================================
  # Build Marketing Web Docker Image
  # =============================================================================
  build-marketing-web:
    name: Build Marketing Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MARKETING_WEB_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/webpage/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ordotodo.app/api/v1
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy Marketing Site to Production (mismo VPS/compose que la app)
  # =============================================================================
  deploy-marketing:
    name: Deploy Marketing to Production
    runs-on: ubuntu-latest
    needs: [build-marketing-web]
    if: always() && needs.build-marketing-web.result == 'success'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v5
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: true

      - name: Copy compose and scripts to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "deploy/docker-compose.plesk.yml,deploy/scripts/health.sh,deploy/scripts/backup-db.sh,deploy/scripts/rollback.sh"
          target: /opt/ordo-todo/.incoming
          strip_components: 1
          rm: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          MARKETING_IMAGE_TAG: ${{ github.sha }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: MARKETING_IMAGE_TAG,GITHUB_USER,GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /opt/ordo-todo
            test -f .env || { echo "::error::Falta /opt/ordo-todo/.env (plantilla: deploy/.env.plesk.example)"; exit 1; }

            echo "[$(date)] 📄 Instalando compose y scripts del repo..."
            install -m 0644 .incoming/docker-compose.plesk.yml docker-compose.yml
            mkdir -p scripts backups
            install -m 0755 .incoming/scripts/*.sh scripts/
            rm -rf .incoming
            docker compose config -q

            echo "[$(date)] 🔐 Login en GHCR..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

            export MARKETING_IMAGE_TAG
            echo "[$(date)] 📦 Descargando landing ${MARKETING_IMAGE_TAG}..."
            docker compose pull webpage

            echo "[$(date)] 🚀 Arrancando landing..."
            docker compose up -d webpage
            ./scripts/health.sh --wait webpage

            sed -i "s/^MARKETING_IMAGE_TAG=.*/MARKETING_IMAGE_TAG=${MARKETING_IMAGE_TAG}/" .env

            docker image prune -af --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/tiagofur/ordo-todo" || true

            docker compose ps webpage
            echo "[$(date)] ✅ Landing desplegada: ${MARKETING_IMAGE_TAG}"

      - name: Notify on Success
        if: success()
        run: echo "✅ Landing desplegada en https://ordotodo.com"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deploy de la landing fallido; revisa los logs."
