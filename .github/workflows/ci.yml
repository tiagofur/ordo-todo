              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi
              working-directory: .

            - name: Lint
              run: npm run lint

            - name: Build Vite bundle
              run: npm run build:vite

    # =============================================================================
    # Mobile (Tauri 2 + React)
    # =============================================================================
    mobile:
        name: Mobile Type Check
        runs-on: ubuntu-latest
        needs: packages
        defaults:
            run:
                working-directory: apps/mobile
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python (for native modules)
              uses: actions/setup-python@v5
              with:
                  python-version: '3.x'

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Restore packages cache
              uses: actions/cache@v5
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

            - name: Install dependencies
              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi
              working-directory: .

            - name: Type check
              run: npm run check-types
