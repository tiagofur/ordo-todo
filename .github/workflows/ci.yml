name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

env:
    NODE_VERSION: "24"

jobs:
    # =============================================================================
    # Shared Packages Build
    # =============================================================================
    packages:
        name: Build Shared Packages
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python (for native modules)
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x'

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Install dependencies
              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi

            - name: Generate Prisma client
              run: npx prisma generate
              working-directory: packages/db

            - name: Build packages
              run: npm run build

            - name: Test packages
              # Runs every workspace test suite under packages/* (api-client,
              # core, db, hooks, online-status, openclaw-plugin, stores,
              # styles, ui). Workspaces without a test script are skipped by
              # turbo; every wired suite is green as of 028 (see odd task doc).
              run: npx turbo run test --filter='./packages/*'

            - name: Cache packages
              uses: actions/cache@v6
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

    # =============================================================================
    # Backend (NestJS)
    # =============================================================================
    backend:
        name: Backend Lint & Tests
        runs-on: ubuntu-latest
        needs: packages
        defaults:
            run:
                working-directory: apps/backend
        env:
            NODE_ENV: test
            PORT: 3001
            API_PREFIX: api
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordo_todo_test
            JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
            JWT_EXPIRATION: 1d
            JWT_REFRESH_EXPIRATION: 7d
            CORS_ORIGINS: http://localhost:3000
        services:
            postgres:
                image: pgvector/pgvector:0.8.7-pg16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ordo_todo_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python (for native modules)
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x'

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Restore packages cache
              uses: actions/cache@v6
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

            - name: Install dependencies
              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi
              working-directory: .

            - name: Generate Prisma client
              run: npx prisma generate
              working-directory: packages/db

            - name: Run database migrations
              run: npx prisma migrate deploy
              working-directory: packages/db

            - name: Lint
              # Backend lint is still non-blocking repo-wide (pre-existing
              # errors outside ODD 027 scope); files touched by a change must
              # be error-free. Tracked to go blocking once the backlog is down.
              run: npm run lint
              continue-on-error: true

            - name: Type check
              run: npm run check-types

            - name: Unit tests
              run: npm run test

            - name: E2E tests
              run: npm run test:e2e

            - name: Build
              run: npm run build

    # =============================================================================
    # Web (Next.js)
    # =============================================================================
    web:
        name: Web Lint & Build
        runs-on: ubuntu-latest
        needs: packages
        defaults:
            run:
                working-directory: apps/web
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python (for native modules)
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x'

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Restore packages cache
              uses: actions/cache@v6
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

            - name: Install dependencies
              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi
              working-directory: .

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run check-types

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:3001

    # =============================================================================
    # Native Android (ODD 050 / 051)
    # =============================================================================
    android:
        name: Android Tests & Build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/native/android

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup JDK
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - name: Unit tests and debug APK
              run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

            - name: Upload test report on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: android-test-report
                  path: apps/native/android/app/build/reports/tests/
                  retention-days: 7

    # =============================================================================
    # Desktop (Tauri v2 + React)
    # =============================================================================
    desktop:
        name: Desktop Lint & Build
        runs-on: ubuntu-latest
        needs: packages
        defaults:
            run:
                working-directory: apps/desktop
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python (for native modules)
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x'

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Restore packages cache
              uses: actions/cache@v6
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

            - name: Install dependencies
              run: |
                  # Force git to use HTTPS instead of SSH for GitHub dependencies
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  
                  MAX_RETRIES=3
                  RETRY_COUNT=0
                  SUCCESS=false
                  
                  until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]
                  do
                    echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES..."
                    if [ -f package-lock.json ]; then
                      if npm ci --legacy-peer-deps; then SUCCESS=true; fi
                    else
                      if npm install --legacy-peer-deps; then SUCCESS=true; fi
                    fi
                    
                    if [ "$SUCCESS" = true ]; then
                      break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    echo "Installation failed. Waiting 15 seconds before retry..."
                    sleep 15
                  done
                  
                  if [ "$SUCCESS" != true ]; then
                    echo "Failed to install dependencies after $MAX_RETRIES attempts."
                    exit 1
                  fi
              working-directory: .

            - name: Lint
              run: npm run lint

            - name: Build Vite bundle
              run: npm run build:vite

    # =============================================================================
    # Extension (Chrome MV3, WXT) — ODD 024
    # =============================================================================
    extension:
        name: Extension Check & Tests
        runs-on: ubuntu-latest
        needs: packages
        defaults:
            run:
                working-directory: apps/extension
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Restore packages cache
              uses: actions/cache@v6
              with:
                  path: |
                      packages/*/dist
                      packages/*/.turbo
                  key: ${{ runner.os }}-packages-${{ github.sha }}

            - name: Install dependencies
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
                  npm ci --legacy-peer-deps
              working-directory: .

            - name: Check types
              run: npm run check-types

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build
